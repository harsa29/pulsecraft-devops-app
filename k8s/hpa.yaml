apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsecraft-backend-hpa
  namespace: pulsecraft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsecraft-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsecraft-frontend-hpa
  namespace: pulsecraft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsecraft-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
