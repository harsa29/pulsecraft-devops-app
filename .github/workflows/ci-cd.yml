name: PulseCraft Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- Job 1: Backend CI (Java Spring Boot) ---
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Java Spring Boot App
        run: |
          cd backend
          chmod +x mvnw || true
          ./mvnw clean test -B || mvn clean test -B

  # --- Job 2: Frontend CI (React Vite) ---
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # --- Job 3: Build & Push Docker Images (Optional if Docker Hub secrets set) ---
  docker-build-push:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && ${{ secrets.DOCKER_USERNAME != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pulsecraft-backend:latest

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pulsecraft-frontend:latest

  # --- Job 4: CD - Zero-Downtime SSH Deployment on AWS Ubuntu Server ---
  deploy-linux-server:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to Remote AWS Linux Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 [1/3] Pulling latest code on server..."
            cd /opt/pulsecraft
            git pull origin main

            echo "🔄 [2/3] Performing zero-downtime rolling reload with Docker Compose..."
            docker compose up --build -d --remove-orphans
            docker image prune -f

            echo "☸️ [3/3] Checking Kubernetes manifests..."
            if command -v kubectl &> /dev/null && kubectl get ns pulsecraft &> /dev/null; then
              echo "Applying Kubernetes updates..."
              kubectl apply -k k8s/
              kubectl rollout restart deployment/pulsecraft-backend -n pulsecraft
              kubectl rollout restart deployment/pulsecraft-frontend -n pulsecraft
            fi

            echo "✅ Deployment completed successfully!"
